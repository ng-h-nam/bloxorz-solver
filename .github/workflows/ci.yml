name: Bloxorz CI

on:
  push:
    branches: [ "main", "feat/update-gui" ] # Test CI o branch feat/update-gui
  pull_request:
    branches: [ "main", "feat/update-gui" ] # Test CI o branch feat/update-gui

permissions:
  contents: read

jobs:
  lint_and_format:
    name: Clean Code (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting and complexity
        run: ruff check .

  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify compilation and imports
        run: python -m compileall .

      - name: Run Pytest (Logic & Smoke Test)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pytest tests/ --cov=. --cov-fail-under=60