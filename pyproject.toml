[tool.ruff]

target-version = "py314"

line-length = 120

# Khai báo các thư mục Ruff KHÔNG ĐƯỢC quét
exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    "assets",
    "docs",
]

[tool.ruff.lint]
# Các nhóm luật kiểm tra: 
# E, W: pycodestyle (lỗi định dạng, khoảng trắng)
# F: pyflakes (lỗi logic cơ bản, biến/thư viện không sử dụng)
# C90: mccabe (kiểm tra độ phức tạp của hàm)
select = ["E", "F", "W", "C90"]

# Bỏ qua luật nào thì thêm vào đây. Ví dụ: "E501" (dòng quá dài, dù đã có line-length)
ignore = []

[tool.ruff.lint.mccabe]
# Cảnh báo nếu một hàm có quá nhiều nhánh if/elif/else hoặc vòng lặp.
# Game thường có vòng lặp chính (game loop) khá phức tạp, để 15 là mức hợp lý (mặc định là 10)
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
